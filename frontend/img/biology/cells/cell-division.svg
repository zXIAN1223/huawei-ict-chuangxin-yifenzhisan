<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="有丝分裂各时期示意图">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1f3b73">有丝分裂的基本过程</text>

  <!-- 五个阶段 -->
  <!-- 间期 -->
  <g>
    <circle cx="90" cy="150" r="52" fill="#eef3ff" stroke="#3b6fd4" stroke-width="2"/>
    <circle cx="90" cy="150" r="16" fill="#5b7ff0"/>
    <g stroke="#7b5bd6" stroke-width="3" fill="none"><path d="M64 176 q18 -12 34 0"/><path d="M70 128 q14 -10 30 0"/></g>
    <text x="90" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3b73">间期</text>
    <text x="90" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">DNA复制、</text>
    <text x="90" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">蛋白质合成</text>
  </g>
  <!-- 前期 -->
  <g>
    <circle cx="240" cy="150" r="52" fill="#eef3ff" stroke="#3b6fd4" stroke-width="2"/>
    <g stroke="#7b5bd6" stroke-width="3"><line x1="222" y1="132" x2="234" y2="146"/><line x1="258" y1="132" x2="246" y2="146"/><line x1="222" y1="168" x2="234" y2="154"/><line x1="258" y1="168" x2="246" y2="154"/></g>
    <g stroke="#c2472f" stroke-width="2" fill="none"><path d="M190 150 q20 -30 40 -20"/></g>
    <text x="240" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3b73">前期</text>
    <text x="240" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">核膜核仁消失，</text>
    <text x="240" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">纺锤体形成</text>
  </g>
  <!-- 中期 -->
  <g>
    <circle cx="390" cy="150" r="52" fill="#eef3ff" stroke="#3b6fd4" stroke-width="2"/>
    <line x1="390" y1="100" x2="390" y2="200" stroke="#c2472f" stroke-width="2"/>
    <g stroke="#7b5bd6" stroke-width="4"><line x1="356" y1="150" x2="384" y2="150"/><line x1="396" y1="150" x2="424" y2="150"/></g>
    <text x="390" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3b73">中期</text>
    <text x="390" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">着丝点排列在</text>
    <text x="390" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">赤道板上</text>
  </g>
  <!-- 后期 -->
  <g>
    <circle cx="540" cy="150" r="52" fill="#eef3ff" stroke="#3b6fd4" stroke-width="2"/>
    <g stroke="#7b5bd6" stroke-width="4"><line x1="504" y1="150" x2="528" y2="150"/><line x1="552" y1="150" x2="576" y2="150"/><line x1="500" y1="140" x2="524" y2="140"/><line x1="556" y1="160" x2="580" y2="160"/></g>
    <text x="540" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3b73">后期</text>
    <text x="540" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">着丝点分裂，</text>
    <text x="540" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">染色体移向两极</text>
  </g>
  <!-- 末期 -->
  <g>
    <circle cx="690" cy="150" r="52" fill="#eef3ff" stroke="#3b6fd4" stroke-width="2"/>
    <g stroke="#7b5bd6" stroke-width="3"><line x1="666" y1="130" x2="676" y2="144"/><line x1="684" y1="156" x2="694" y2="170"/><line x1="706" y1="130" x2="716" y2="144"/></g>
    <text x="690" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3b73">末期</text>
    <text x="690" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">核膜核仁重现，</text>
    <text x="690" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3b73">细胞质分裂</text>
  </g>

  <!-- 结果 -->
  <rect x="60" y="296" width="640" height="34" rx="17" fill="#1f3b73"/>
  <text x="380" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">结果：亲代细胞的染色体经复制后平均分配到两个子细胞，遗传物质稳定传递</text>
</svg>