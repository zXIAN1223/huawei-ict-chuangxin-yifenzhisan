<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="酶与ATP示意图">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1f3b73">酶的作用特点与 ATP 的结构</text>

  <!-- 酶-底物锁钥 -->
  <text x="180" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4a2f9e">酶的专一性（锁钥模型）</text>
  <!-- 酶 -->
  <path d="M60 200 a50 50 0 0 1 100 0 l0 30 a30 30 0 0 1 -30 -20 l-40 0 a30 30 0 0 1 -30 20 z" fill="#7b5bd6" stroke="#4a2f9e" stroke-width="2"/>
  <text x="110" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">酶</text>
  <!-- 底物 -->
  <path d="M196 210 l28 -14 l0 28 l-28 -14 z" fill="#c98f0f" stroke="#8a6410" stroke-width="2"/>
  <text x="240" y="200" font-family="sans-serif" font-size="13" fill="#8a6410">底物</text>
  <path d="M240 210 L250 210" stroke="#5b5b5b" stroke-width="2" stroke-dasharray="1 0"/>
  <text x="300" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a2f9e">酶降低活化能</text>
  <text x="300" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a2f9e">专一性 · 高效性 · 温和性</text>
  <text x="300" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a2f9e">本质：绝大多数是蛋白质，少数是RNA</text>

  <!-- 分隔线 -->
  <line x1="420" y1="60" x2="420" y2="380" stroke="#c6d5ee" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ATP -->
  <text x="570" y="76" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c2472f">ATP：直接能源物质</text>
  <g font-family="sans-serif" font-size="18" fill="#8a2b18">
    <text x="470" y="150">A</text>
    <text x="496" y="150">—</text>
    <text x="512" y="150">P</text>
    <text x="544" y="150">~</text>
    <text x="560" y="150">P</text>
    <text x="592" y="150">~</text>
    <text x="608" y="150">P</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#8a2b18">
    <text x="470" y="176">腺苷</text>
    <text x="506" y="176">普通磷酸键</text>
    <text x="556" y="176">高能磷酸键</text>
    <text x="600" y="176">高能磷酸键</text>
  </g>
  <text x="540" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a2b18">A—P~P~P（三磷酸腺苷）</text>
  <text x="540" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a2b18">远离腺苷的高能磷酸键易断裂</text>
  <text x="540" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a2b18">ATP ⇌ ADP + Pi + 能量</text>

  <rect x="40" y="320" width="640" height="60" rx="10" fill="#eaf2ff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="360" y="346" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f3b73">ATP 与 ADP 相互转化，是细胞中能量“通货”；ATP 水解释放的能量用于各项生命活动</text>
  <text x="360" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f3b73">合成 ATP 的能量来源：细胞呼吸（主要）与光合作用（绿色植物）</text>
</svg>