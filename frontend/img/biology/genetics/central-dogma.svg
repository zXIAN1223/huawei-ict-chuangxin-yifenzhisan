<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="780" height="470" fill="#ffffff"/>
  <rect width="780" height="52" fill="#2c5282"/>
  <text x="390" y="34" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="bold">中心法则与基因表达</text>

  <!-- 三个核心框 -->
  <rect x="60" y="150" width="170" height="80" rx="14" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="145" y="185" text-anchor="middle" font-size="20" fill="#2b6cb0" font-weight="bold">DNA</text>
  <text x="145" y="210" text-anchor="middle" font-size="12" fill="#2c5282">脱氧核糖核酸</text>

  <rect x="305" y="150" width="170" height="80" rx="14" fill="#faf5ff" stroke="#6b46c1" stroke-width="2.5"/>
  <text x="390" y="185" text-anchor="middle" font-size="20" fill="#6b46c1" font-weight="bold">RNA</text>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#553c9a">核糖核酸（mRNA）</text>

  <rect x="550" y="150" width="170" height="80" rx="14" fill="#fffaf0" stroke="#c05621" stroke-width="2.5"/>
  <text x="635" y="185" text-anchor="middle" font-size="20" fill="#c05621" font-weight="bold">蛋白质</text>
  <text x="635" y="210" text-anchor="middle" font-size="12" fill="#975a16">承担生命活动</text>

  <!-- 复制（DNA→DNA） -->
  <path d="M145 150 C145 120 145 110 145 96" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M100 96 L190 96" stroke="#2b6cb0" stroke-width="3"/>
  <text x="145" y="88" text-anchor="middle" font-size="13" fill="#2b6cb0" font-weight="bold">复制</text>

  <!-- 转录 DNA→RNA -->
  <path d="M232 190 L300 190" fill="none" stroke="#6b46c1" stroke-width="3" marker-end="url(#a3)"/>
  <text x="266" y="180" text-anchor="middle" font-size="13" fill="#6b46c1" font-weight="bold">转录</text>

  <!-- 翻译 RNA→蛋白质 -->
  <path d="M477 190 L546 190" fill="none" stroke="#c05621" stroke-width="3" marker-end="url(#a4)"/>
  <text x="511" y="180" text-anchor="middle" font-size="13" fill="#c05621" font-weight="bold">翻译</text>

  <!-- 逆转录 RNA→DNA -->
  <path d="M390 232 L390 300 L145 300 L145 234" fill="none" stroke="#38a169" stroke-width="3" marker-end="url(#a5)"/>
  <text x="250" y="322" font-size="13" fill="#2f855a" font-weight="bold">逆转录（RNA 病毒）</text>

  <!-- RNA 复制 -->
  <path d="M330 96 C330 80 450 80 450 96" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#a6)"/>
  <text x="390" y="72" text-anchor="middle" font-size="13" fill="#805ad5" font-weight="bold">RNA 复制（某些病毒）</text>

  <!-- 说明 -->
  <rect x="60" y="352" width="660" height="96" rx="10" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="390" y="378" text-anchor="middle" font-size="14" fill="#1a202c" font-weight="bold">中心法则：遗传信息在生物大分子间的传递规律</text>
  <text x="90" y="404" font-size="13" fill="#2d3748">· 主线索：DNA → RNA → 蛋白质（多数细胞生物）</text>
  <text x="90" y="426" font-size="13" fill="#2d3748">· 补充：逆转录、RNA 复制（病毒中），说明中心法则也在发展完善</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2b6cb0"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#6b46c1"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#c05621"/></marker>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#38a169"/></marker>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#805ad5"/></marker>
  </defs>
</svg>