<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="780" height="500" fill="#ffffff"/>
  <rect width="780" height="52" fill="#2f855a"/>
  <text x="390" y="34" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="bold">DNA 的半保留复制</text>

  <!-- 图例 -->
  <rect x="560" y="64" width="22" height="12" fill="#2b6cb0"/>
  <text x="590" y="74" font-size="13" fill="#2d3748">亲代旧链</text>
  <rect x="660" y="64" width="22" height="12" fill="#90cdf4"/>
  <text x="690" y="74" font-size="13" fill="#2d3748">新合成链</text>

  <!-- 亲代 DNA -->
  <text x="70" y="105" font-size="14" fill="#1a202c" font-weight="bold">① 亲代 DNA（双链）</text>
  <rect x="70" y="115" width="240" height="18" rx="4" fill="#2b6cb0"/>
  <rect x="70" y="133" width="240" height="18" rx="4" fill="#2b6cb0"/>
  <text x="330" y="134" font-size="12" fill="#4a5568">两条链均可作模板</text>

  <!-- 解旋箭头 -->
  <path d="M180 158 L180 196" stroke="#4a5568" stroke-width="3" marker-end="url(#arr)"/>
  <text x="192" y="182" font-size="13" fill="#2d3748">解旋酶打开双链，氢键断裂</text>

  <!-- 复制叉 -->
  <text x="70" y="228" font-size="14" fill="#1a202c" font-weight="bold">② 复制叉：以每条母链为模板</text>
  <path d="M110 246 L200 246" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M210 246 L300 246" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M110 246 L100 292" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 246 L310 292" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 246 L205 292" stroke="#90cdf4" stroke-width="8" stroke-linecap="round"/>
  <path d="M210 246 L215 292" stroke="#90cdf4" stroke-width="8" stroke-linecap="round"/>
  <text x="330" y="270" font-size="13" fill="#2d3748">DNA 聚合酶沿 5′→3′ 方向延伸新链</text>
  <text x="330" y="292" font-size="13" fill="#2d3748">碱基互补配对：A-T、G-C</text>

  <!-- 子代 DNA ×2 -->
  <text x="70" y="368" font-size="14" fill="#1a202c" font-weight="bold">③ 两个子代 DNA（各含 1 旧链 + 1 新链）</text>
  <rect x="70" y="382" width="200" height="18" rx="4" fill="#2b6cb0"/>
  <rect x="70" y="400" width="200" height="18" rx="4" fill="#90cdf4"/>
  <rect x="360" y="382" width="200" height="18" rx="4" fill="#2b6cb0"/>
  <rect x="360" y="400" width="200" height="18" rx="4" fill="#90cdf4"/>

  <text x="70" y="440" font-size="13" fill="#2f855a" font-weight="bold">半保留：每个子代 DNA 保留一条母链</text>
  <text x="360" y="440" font-size="13" fill="#2f855a" font-weight="bold">保证遗传信息准确传递</text>

  <rect x="70" y="456" width="640" height="34" rx="8" fill="#f0fff4" stroke="#9ae6b4"/>
  <text x="390" y="478" text-anchor="middle" font-size="13" fill="#22543d">复制特点：边解旋边复制 · 半保留复制 · 半不连续复制（其中一条链分片段合成）</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#4a5568"/>
    </marker>
  </defs>
</svg>