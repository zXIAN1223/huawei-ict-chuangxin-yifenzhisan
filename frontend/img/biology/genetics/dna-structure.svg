<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="780" height="470" fill="#ffffff"/>
  <rect width="780" height="52" fill="#2b6cb0"/>
  <text x="390" y="34" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="bold">DNA 双螺旋结构与碱基互补配对</text>

  <!-- 两条反向平行的糖-磷酸骨架（相互缠绕） -->
  <path d="M200 90 Q280 120 200 150 Q120 180 200 210 Q280 240 200 270 Q120 300 200 330 Q280 360 200 390"
        fill="none" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 90 Q120 120 200 150 Q280 180 200 210 Q120 240 200 270 Q280 300 200 330 Q120 360 200 390"
        fill="none" stroke="#63b3ed" stroke-width="8" stroke-linecap="round"/>

  <!-- 碱基对横档：左 A / 右 T -->
  <line x1="160" y1="120" x2="240" y2="120" stroke="#a0aec0" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="160" cy="120" r="11" fill="#e53e3e"/><text x="160" y="125" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">A</text>
  <circle cx="240" cy="120" r="11" fill="#38a169"/><text x="240" y="125" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">T</text>

  <!-- G / C -->
  <line x1="160" y1="180" x2="240" y2="180" stroke="#a0aec0" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="160" cy="180" r="11" fill="#805ad5"/><text x="160" y="185" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">G</text>
  <circle cx="240" cy="180" r="11" fill="#dd6b20"/><text x="240" y="185" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">C</text>

  <!-- T / A -->
  <line x1="160" y1="240" x2="240" y2="240" stroke="#a0aec0" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="160" cy="240" r="11" fill="#38a169"/><text x="160" y="245" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">T</text>
  <circle cx="240" cy="240" r="11" fill="#e53e3e"/><text x="240" y="245" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">A</text>

  <!-- C / G -->
  <line x1="160" y1="300" x2="240" y2="300" stroke="#a0aec0" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="160" cy="300" r="11" fill="#dd6b20"/><text x="160" y="305" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">C</text>
  <circle cx="240" cy="300" r="11" fill="#805ad5"/><text x="240" y="305" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">G</text>

  <!-- A / T -->
  <line x1="160" y1="360" x2="240" y2="360" stroke="#a0aec0" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="160" cy="360" r="11" fill="#e53e3e"/><text x="160" y="365" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">A</text>
  <circle cx="240" cy="360" r="11" fill="#38a169"/><text x="240" y="365" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">T</text>

  <text x="200" y="428" text-anchor="middle" font-size="12" fill="#4a5568">两条链反向平行盘旋 · 每 10 个碱基对约绕一圈</text>
  <text x="60" y="240" font-size="12" fill="#2b6cb0" font-weight="bold">5′→3′</text>
  <text x="60" y="262" font-size="12" fill="#2c5282" font-weight="bold">3′→5′</text>

  <!-- 右侧说明卡片 -->
  <rect x="400" y="80" width="356" height="330" rx="12" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="420" y="110" font-size="16" fill="#1a202c" font-weight="bold">碱基互补配对原则</text>
  <rect x="420" y="126" width="316" height="2" fill="#e2e8f0"/>

  <circle cx="436" cy="158" r="12" fill="#e53e3e"/><text x="436" y="163" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">A</text>
  <text x="458" y="163" font-size="14" fill="#2d3748">腺嘌呤 —— 与 T 配对（2 个氢键）</text>

  <circle cx="436" cy="196" r="12" fill="#38a169"/><text x="436" y="201" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">T</text>
  <text x="458" y="201" font-size="14" fill="#2d3748">胸腺嘧啶 —— 与 A 配对（2 个氢键）</text>

  <circle cx="436" cy="234" r="12" fill="#805ad5"/><text x="436" y="239" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">G</text>
  <text x="458" y="239" font-size="14" fill="#2d3748">鸟嘌呤 —— 与 C 配对（3 个氢键）</text>

  <circle cx="436" cy="272" r="12" fill="#dd6b20"/><text x="436" y="277" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">C</text>
  <text x="458" y="277" font-size="14" fill="#2d3748">胞嘧啶 —— 与 G 配对（3 个氢键）</text>

  <rect x="420" y="300" width="316" height="2" fill="#e2e8f0"/>
  <text x="420" y="326" font-size="14" fill="#2d3748">· A 与 T 配对、G 与 C 配对，使双链保持等宽</text>
  <text x="420" y="350" font-size="14" fill="#2d3748">· 螺旋直径约 2 nm，螺距约 3.4 nm</text>
  <text x="420" y="374" font-size="14" fill="#2d3748">· 基本单位：脱氧核苷酸 = 磷酸 + 脱氧核糖 + 碱基</text>
  <text x="420" y="398" font-size="14" fill="#2d3748">· A=T、G=C 是 DNA 半保留复制的分子基础</text>
</svg>