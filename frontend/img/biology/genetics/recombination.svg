<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <rect width="780" height="470" fill="#ffffff"/>
  <rect width="780" height="52" fill="#2c7a7b"/>
  <text x="390" y="34" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="bold">基因重组的两种主要来源</text>

  <!-- 左：交叉互换 -->
  <text x="60" y="92" font-size="14" fill="#1a202c" font-weight="bold">① 同源染色体非姐妹染色单体交叉互换</text>
  <!-- 两条同源染色体 -->
  <path d="M110 110 L110 210" stroke="#2b6cb0" stroke-width="7"/>
  <path d="M170 110 L170 210" stroke="#63b3ed" stroke-width="7"/>
  <path d="M250 110 L250 210" stroke="#2b6cb0" stroke-width="7"/>
  <path d="M310 110 L310 210" stroke="#63b3ed" stroke-width="7"/>
  <!-- 交叉点 -->
  <path d="M170 160 C210 160 210 160 250 160" stroke="#e53e3e" stroke-width="6"/>
  <circle cx="170" cy="160" r="5" fill="#e53e3e"/><circle cx="250" cy="160" r="5" fill="#e53e3e"/>
  <text x="210" y="150" text-anchor="middle" font-size="12" fill="#c53030" font-weight="bold">交叉点</text>
  <!-- 结果 -->
  <path d="M110 250 L110 300" stroke="#2b6cb0" stroke-width="7"/>
  <path d="M170 250 L170 300" stroke="#63b3ed" stroke-width="7"/>
  <path d="M250 250 L250 300" stroke="#2b6cb0" stroke-width="7"/>
  <path d="M310 250 L310 300" stroke="#63b3ed" stroke-width="7"/>
  <!-- 交换片段示意 -->
  <rect x="165" y="200" width="90" height="14" fill="#faf089" stroke="#d69e2e"/>
  <text x="210" y="322" text-anchor="middle" font-size="12" fill="#4a5568">片段互换 → 产生新的染色体组合</text>

  <line x1="380" y1="90" x2="380" y2="330" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 右：自由组合 -->
  <text x="410" y="92" font-size="14" fill="#1a202c" font-weight="bold">② 减数分裂非同源染色体自由组合</text>
  <!-- 两对染色体 -->
  <rect x="430" y="110" width="18" height="60" rx="8" fill="#2b6cb0"/>
  <rect x="470" y="110" width="18" height="60" rx="8" fill="#63b3ed"/>
  <rect x="560" y="110" width="18" height="60" rx="8" fill="#805ad5"/>
  <rect x="600" y="110" width="18" height="60" rx="8" fill="#d6bcfa"/>
  <text x="455" y="196" text-anchor="middle" font-size="12" fill="#2b6cb0">一对同源染色体</text>
  <text x="590" y="196" text-anchor="middle" font-size="12" fill="#805ad5">另一对同源染色体</text>

  <!-- 组合结果 -->
  <text x="410" y="236" font-size="13" fill="#2d3748" font-weight="bold">配子中染色体组合（示例）</text>
  <rect x="430" y="250" width="18" height="50" rx="8" fill="#2b6cb0"/>
  <rect x="470" y="250" width="18" height="50" rx="8" fill="#805ad5"/>
  <text x="520" y="282" font-size="12" fill="#4a5568">组合 1</text>

  <rect x="600" y="250" width="18" height="50" rx="8" fill="#63b3ed"/>
  <rect x="640" y="250" width="18" height="50" rx="8" fill="#d6bcfa"/>
  <text x="688" y="282" font-size="12" fill="#4a5568">组合 2</text>

  <rect x="60" y="352" width="670" height="104" rx="10" fill="#e6fffa" stroke="#81e6d9"/>
  <text x="395" y="378" text-anchor="middle" font-size="14" fill="#234e52" font-weight="bold">基因重组的意义</text>
  <text x="80" y="402" font-size="13" fill="#285e61">· 基因重组是生物变异的重要来源，能产生大量新的基因组合（新的性状组合）</text>
  <text x="80" y="424" font-size="13" fill="#285e61">· 交叉互换发生在同源染色体的非姐妹染色单体之间，交换等位基因</text>
  <text x="80" y="446" font-size="13" fill="#285e61">· 自由组合发生在减数第一次分裂后期，非同源染色体随机组合；不产生新基因，只产生新组合</text>
</svg>